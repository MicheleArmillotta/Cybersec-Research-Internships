name: Update internships

on:
  schedule:
    - cron: "0 6 * * *"   # every day 06:00 UTC (08:00 Rome in summer, 07:00 in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch internships
        run: python -m scraper

      - name: Commit updated data
        run: |
          git config user.name "internship-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git push
          fi
